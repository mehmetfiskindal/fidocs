<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} — {{siteTitle}}</title>
<meta name="description" content="{{description}}">
<script>try{var t=localStorage.getItem('fidocs-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
:root{color-scheme:light;--bg:#fff;--fg:#1a1a1a;--muted:#666;--border:#e5e5e5;--accent:#3b5bdb;--accent-fg:#fff;--code-bg:#f6f8fa}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){color-scheme:dark;--bg:#16181d;--fg:#e4e6eb;--muted:#9aa0aa;--border:#2c3038;--accent:#91a7ff;--accent-fg:#16181d;--code-bg:#1f2229}
}
:root[data-theme="dark"]{color-scheme:dark;--bg:#16181d;--fg:#e4e6eb;--muted:#9aa0aa;--border:#2c3038;--accent:#91a7ff;--accent-fg:#16181d;--code-bg:#1f2229}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--fg);background:var(--bg)}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.wrap{display:flex;max-width:1280px;margin:0 auto;gap:2rem;padding:1.5rem}
nav.toc{width:220px;flex-shrink:0;border-right:1px solid var(--border);padding-right:1rem;align-self:flex-start;position:sticky;top:1.5rem}
.nav-head{display:flex;align-items:center;justify-content:space-between}
nav.toc h2{font-size:.8rem;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
nav.toc ul{list-style:none;margin:0;padding:0}
nav.toc li{margin:.25rem 0}
nav.toc a{display:block;padding:.25rem .5rem;border-radius:6px;color:var(--fg)}
nav.toc a.active{background:var(--accent);color:var(--accent-fg)}
.theme-toggle{border:1px solid var(--border);background:var(--code-bg);color:var(--fg);border-radius:6px;padding:.15rem .5rem;font-size:1rem;line-height:1.4;cursor:pointer}
.theme-toggle:hover{border-color:var(--accent)}
main{flex:1;min-width:0}
main h1{font-size:2rem;margin-top:0}
main h2,main h3{scroll-margin-top:1rem}
aside.page-toc{width:200px;flex-shrink:0;align-self:flex-start;position:sticky;top:1.5rem;font-size:.875rem;border-left:1px solid var(--border);padding-left:1rem}
aside.page-toc h2{font-size:.8rem;text-transform:uppercase;color:var(--muted);letter-spacing:.05em;margin-top:.5rem}
aside.page-toc ul{list-style:none;margin:0;padding:0}
aside.page-toc ul ul{padding-left:.75rem}
aside.page-toc li{margin:.3rem 0}
aside.page-toc a{color:var(--muted)}aside.page-toc a:hover{color:var(--accent)}
@media (max-width:1100px){aside.page-toc{display:none}}
pre.code{background:var(--code-bg);padding:1rem;border-radius:8px;overflow:auto;border:1px solid var(--border)}
code{background:var(--code-bg);padding:.15em .35em;border-radius:4px;font-size:.9em}
pre.code code{background:none;padding:0}
blockquote{border-left:4px solid var(--accent);margin:1rem 0;padding:.5rem 1rem;background:var(--code-bg);border-radius:0 8px 8px 0}
.callout{--c:var(--accent);border-left:4px solid var(--c);margin:1rem 0;padding:.5rem 1rem;background:var(--code-bg);border-radius:0 8px 8px 0}
.callout-title{font-weight:600;color:var(--c);margin:.25rem 0}
.callout-tip{--c:#2f9e44}.callout-important{--c:#7048e8}.callout-warning{--c:#e67700}.callout-caution{--c:#e03131}
li.task-list-item{list-style:none}li.task-list-item input{margin:0 .4em 0 -1.4em;vertical-align:middle}
table{border-collapse:collapse;width:100%;margin:1rem 0}
th,td{border:1px solid var(--border);padding:.5rem .75rem;text-align:left}
th{background:var(--code-bg)}
.fidocs-component{border:1px dashed var(--border);border-radius:8px;padding:1rem;margin:1rem 0}
footer{color:var(--muted);font-size:.85rem;margin-top:3rem;border-top:1px solid var(--border);padding-top:1rem}
</style>
</head>
<body>
<div class="wrap">
<nav class="toc">
<div class="nav-head">
<h2>Docs</h2>
<button type="button" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
</div>
<ul>{{nav}}</ul>
</nav>
<main>
{{content}}
</main>
{{toc}}
</div>
<script>
(function(){
  var btn=document.querySelector('.theme-toggle');
  if(!btn)return;
  btn.addEventListener('click',function(){
    var root=document.documentElement;
    var current=root.getAttribute('data-theme');
    var dark=current?current==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;
    var next=dark?'light':'dark';
    root.setAttribute('data-theme',next);
    try{localStorage.setItem('fidocs-theme',next)}catch(e){}
  });
})();
</script>
</body>
</html>
