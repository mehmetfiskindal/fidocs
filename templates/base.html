<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} — {{siteTitle}}</title>
<meta name="description" content="{{description}}">
<style>
:root{--bg:#fff;--fg:#1a1a1a;--muted:#666;--border:#e5e5e5;--accent:#3b5bdb;--code-bg:#f6f8fa}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--fg);background:var(--bg)}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.wrap{display:flex;max-width:1100px;margin:0 auto;gap:2rem;padding:1.5rem}
nav.toc{width:220px;flex-shrink:0;border-right:1px solid var(--border);padding-right:1rem}
nav.toc h2{font-size:.8rem;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
nav.toc ul{list-style:none;margin:0;padding:0}
nav.toc li{margin:.25rem 0}
nav.toc a{display:block;padding:.25rem .5rem;border-radius:6px;color:var(--fg)}
nav.toc a.active{background:var(--accent);color:#fff}
main{flex:1;min-width:0}
main h1{font-size:2rem;margin-top:0}
pre.code{background:var(--code-bg);padding:1rem;border-radius:8px;overflow:auto;border:1px solid var(--border)}
code{background:var(--code-bg);padding:.15em .35em;border-radius:4px;font-size:.9em}
pre.code code{background:none;padding:0}
blockquote{border-left:4px solid var(--accent);margin:1rem 0;padding:.5rem 1rem;background:var(--code-bg);border-radius:0 8px 8px 0}
table{border-collapse:collapse;width:100%;margin:1rem 0}
th,td{border:1px solid var(--border);padding:.5rem .75rem;text-align:left}
th{background:var(--code-bg)}
.fidocs-component{border:1px dashed var(--border);border-radius:8px;padding:1rem;margin:1rem 0}
footer{color:var(--muted);font-size:.85rem;margin-top:3rem;border-top:1px solid var(--border);padding-top:1rem}
</style>
</head>
<body>
<div class="wrap">
<nav class="toc">
<h2>Docs</h2>
<ul>{{nav}}</ul>
</nav>
<main>
{{content}}
</main>
</div>
</body>
</html>
